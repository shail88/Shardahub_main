<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games | ShardaHub - Play & Win</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- ShardaHub Core Assets -->
    <link rel="stylesheet" href="../assets/css/core.css">
    <link rel="stylesheet" href="styles.css">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../lib/supabase.js"></script>
</head>

<body>
    <!-- Dynamic Sidebar Integration -->
    <div id="shardahub-sidebar"></div>

    <div class="main-wrapper">
        <div class="container-fluid p-0">
            <div class="container py-4 mb-5 text-center">
                <i class="bi bi-joystick display-1 text-info mb-4"></i>
                <h1 class="display-4 fw-bold mb-3">Experience <span class="text-gradient">Unlimited Play</span></h1>
                <p class="lead text-secondary">Browser-based games designed for instant fun and competition.</p>
                <div class="d-flex justify-content-center gap-3">
                    <button class="btn btn-info btn-lg rounded-pill px-5 fw-bold glow-effect">Play Featured
                        Game</button>
                    <button class="btn btn-outline-light btn-lg rounded-pill px-5 fw-bold">Leaderboard</button>
                </div>
            </div>

            <!-- Dynamic Games Grid -->
            <div class="row g-4 mb-5" id="games-grid">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-info" role="status"></div>
                    <p class="mt-2 text-secondary">Loading instant games...</p>
                </div>
            </div>

            <div id="shardahub-footer"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/sharda-db.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/sidebar.js"></script>
    <script src="../assets/js/header.js"></script>
    <script src="../assets/js/footer.js"></script>
    <script src="script.js"></script>
</body>

</html>
