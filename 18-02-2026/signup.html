<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | ShardaHub Ecosystem</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- ShardaHub Core Assets -->
    <link rel="stylesheet" href="assets/css/core.css">
    <style>
        body {
            background: radial-gradient(circle at top right, rgba(139, 92, 246, 0.1) 0%, rgba(15, 23, 42, 1) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            width: 100%;
            max-width: 480px;
            padding: 3rem;
        }

        .form-control-auth {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
        }
    </style>
</head>

<body>
    <div class="glass auth-card rounded-4">
        <div class="text-center mb-5">
            <a href="index.html" class="text-decoration-none">
                <i class="bi bi-layers-half fs-1 text-gradient"></i>
                <h2 class="fw-bold text-white mt-2">Join ShardaHub</h2>
            </a>
            <p class="text-secondary">One account for all our digital platforms.</p>
        </div>

        <form>
            <div class="row g-3 mb-4">
                <div class="col">
                    <label class="form-label text-secondary small">FIRST NAME</label>
                    <input type="text" class="form-control form-control-auth" placeholder="John">
                </div>
                <div class="col">
                    <label class="form-label text-secondary small">LAST NAME</label>
                    <input type="text" class="form-control form-control-auth" placeholder="Doe">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary small">EMAIL ADDRESS</label>
                <input type="email" class="form-control form-control-auth" placeholder="name@company.com">
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary small">PASSWORD</label>
                <input type="password" class="form-control form-control-auth" placeholder="Create a strong password">
            </div>
            <div class="mb-4">
                <div class="form-check">
                    <input class="form-check-input bg-transparent border-secondary" type="checkbox" id="terms" required>
                    <label class="form-check-label text-secondary small" for="terms">I agree to the Terms of Service &
                        Privacy Policy</label>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 rounded-pill py-3 fw-bold glow-effect">Create
                Account</button>
        </form>

        <div class="text-center mt-5">
            <p class="text-secondary small">Already have an account? <a href="login.html"
                    class="text-info text-decoration-none fw-bold">Sign In</a></p>
        </div>
    </div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="lib/supabase.js"></script>
    <script>
        document.querySelector('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const inputs = e.target.querySelectorAll('input');
            const firstName = inputs[0].value.trim();
            const lastName = inputs[1].value.trim();
            const email = inputs[2].value.trim();
            const password = inputs[3].value;
            const fullName = `${firstName} ${lastName}`;

            if (!email || !password || !firstName) {
                alert("Please fill in all required fields.");
                return;
            }

            if (password.length < 6) {
                alert("Password must be at least 6 characters long.");
                return;
            }

            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Creating Account...';

            try {
                const { data, error } = await window.shardaHubAuth.signUp(email, password, fullName);

                if (error) {
                    // Handle specific Supabase errors
                    let msg = error.message;
                    if (msg.includes("rate limit")) {
                        msg = "Registration rate limit exceeded. Please wait a few minutes before trying again.";
                    }
                    alert(msg || "Registration failed. Please try again.");
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Create Account';
                } else {
                    alert("Account created successfully! Please check your email for verification.");
                    window.location.href = 'login.html';
                }
            } catch (err) {
                console.error("Signup error:", err);
                alert("An unexpected error occurred. Please check your connection and try again.");
                submitBtn.disabled = false;
                submitBtn.innerText = 'Create Account';
            }
        });
    </script>
</body>

</html>
