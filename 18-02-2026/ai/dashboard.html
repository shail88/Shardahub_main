<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | AI Tools ShardaHub</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- ShardaHub Core Assets -->
    <link rel="stylesheet" href="../assets/css/core.css">
</head>

<body>
    <div id="shardahub-sidebar"></div>

    <div class="main-wrapper">
        <header
            class="py-3 px-4 d-flex justify-content-between align-items-center border-bottom border-secondary glass sticky-top">
            <h1 class="h4 mb-0 fw-bold">User Dashboard</h1>
            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-dark border-secondary rounded-circle"><i class="bi bi-bell"></i></button>
                <button class="btn btn-sm btn-info rounded-pill px-3 fw-bold">Admin Panel</button>
            </div>
        </header>

        <div class="container-fluid py-5 px-md-5">
            <div class="row g-4">
                <!-- Usage Overview -->
                <div class="col-md-4">
                    <div class="glass p-4 rounded-4 h-100">
                        <h5 class="text-secondary small fw-bold">CURRENT PLAN</h5>
                        <h2 class="fw-bold">Pro AI <span class="badge bg-info text-dark fs-6 ms-2">Active</span></h2>
                        <div class="mt-4">
                            <div class="d-flex justify-content-between mb-1">
                                <span class="small text-secondary">Credit Usage</span>
                                <span class="small text-info">250 / 1000</span>
                            </div>
                            <div class="progress" style="height: 8px; background: rgba(255,255,255,0.1)">
                                <div class="progress-bar bg-info" role="progressbar" style="width: 25%"></div>
                            </div>
                        </div>
                        <button class="btn btn-outline-info w-100 mt-4 rounded-pill">Manage Subscription</button>
                    </div>
                </div>

                <!-- Recent Activity -->
                <div class="col-md-8">
                    <div class="glass p-4 rounded-4">
                        <h5 class="fw-bold mb-4">Recent Tool Usage</h5>
                        <div class="table-responsive">
                            <table class="table table-dark table-hover border-transparent">
                                <thead class="text-secondary small">
                                    <tr>
                                        <th>Date</th>
                                        <th>Tool</th>
                                        <th>Status</th>
                                        <th>Credits</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>Feb 12, 2026</td>
                                        <td>Resume AI</td>
                                        <td><span class="text-success">Completed</span></td>
                                        <td>-5</td>
                                    </tr>
                                    <tr>
                                        <td>Feb 11, 2026</td>
                                        <td>Image AI</td>
                                        <td><span class="text-success">Completed</span></td>
                                        <td>-10</td>
                                    </tr>
                                    <tr>
                                        <td>Feb 10, 2026</td>
                                        <td>Code AI</td>
                                        <td><span class="text-danger">Failed (Refunded)</span></td>
                                        <td>0</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="col-12">
                    <div class="row g-4">
                        <div class="col-md-3">
                            <div class="glass p-4 rounded-4 text-center">
                                <i class="bi bi-plus-circle display-6 text-info mb-2"></i>
                                <h6 class="fw-bold">Buy Credits</h6>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="glass p-4 rounded-4 text-center">
                                <i class="bi bi-receipt display-6 text-info mb-2"></i>
                                <h6 class="fw-bold">Invoices</h6>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="glass p-4 rounded-4 text-center">
                                <i class="bi bi-gear display-6 text-info mb-2"></i>
                                <h6 class="fw-bold">Settings</h6>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="glass p-4 rounded-4 text-center">
                                <i class="bi bi-shield-lock display-6 text-info mb-2"></i>
                                <h6 class="fw-bold">API Access</h6>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="shardahub-footer"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/sidebar.js"></script>
    <script src="../assets/js/footer.js"></script>
</body>

</html>
