<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Courses | Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/core.css">
</head>

<body class="bg-dark text-white">
    <div id="shardahub-sidebar"></div>

    <div class="main-wrapper">
        <header
            class="py-3 px-4 d-flex justify-content-between align-items-center border-bottom border-secondary glass sticky-top">
            <h1 class="h4 mb-0 fw-bold"><i class="bi bi-mortarboard text-info me-2"></i>Course Management</h1>
            <button class="btn btn-info rounded-pill px-4 fw-bold" data-bs-toggle="modal" data-bs-target="#courseModal"
                onclick="resetForm()">
                <i class="bi bi-plus-lg"></i> Add New Course
            </button>
        </header>

        <div class="container-fluid py-5 px-md-5">
            <div id="courseList" class="row">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-info" role="status"></div>
                    <p class="mt-3 text-secondary">Loading courses...</p>
                </div>
            </div>
        </div>

        <div id="shardahub-footer"></div>
    </div>

    <!-- Course Modal -->
    <div class="modal fade" id="courseModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content glass border-secondary shadow-2xl rounded-5 overflow-hidden">
                <div class="modal-header border-secondary bg-dark bg-opacity-50 py-3">
                    <h5 class="modal-title fw-bold d-flex align-items-center">
                        <i class="bi bi-pencil-square text-info me-2"></i> Course Details
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="courseForm">
                        <input type="hidden" id="courseId">
                        <div class="row g-4">
                            <div class="col-md-8">
                                <label class="form-label small text-secondary fw-bold tracking-wider">COURSE
                                    TITLE</label>
                                <input type="text"
                                    class="form-control bg-dark bg-opacity-25 text-white border-secondary rounded-3 py-2"
                                    id="title" placeholder="e.g. Master Web Development" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-secondary fw-bold tracking-wider">PRICE
                                    (INR)</label>
                                <div class="input-group">
                                    <span
                                        class="input-group-text bg-dark bg-opacity-25 border-secondary text-secondary">₹</span>
                                    <input type="number"
                                        class="form-control bg-dark bg-opacity-25 text-white border-secondary rounded-end-3 py-2"
                                        id="price" value="0" required>
                                </div>
                            </div>
                            <div class="col-12">
                                <label
                                    class="form-label small text-secondary fw-bold tracking-wider">DESCRIPTION</label>
                                <textarea
                                    class="form-control bg-dark bg-opacity-25 text-white border-secondary rounded-3"
                                    id="description" rows="3"
                                    placeholder="Tell students what they will learn..."></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-secondary fw-bold tracking-wider">THUMBNAIL
                                    URL</label>
                                <input type="text"
                                    class="form-control bg-dark bg-opacity-25 text-white border-secondary rounded-3 py-2"
                                    id="thumbnail_url" placeholder="https://images.unsplash.com/...">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-secondary fw-bold tracking-wider">CATEGORY</label>
                                <select
                                    class="form-select bg-dark bg-opacity-25 text-white border-secondary rounded-3 py-2"
                                    id="category">
                                    <option value="Education" class="bg-dark">Education</option>
                                    <option value="Development" class="bg-dark">Development</option>
                                    <option value="Design" class="bg-dark">Design</option>
                                    <option value="Business" class="bg-dark">Business</option>
                                    <option value="AI" class="bg-dark">AI</option>
                                    <option value="E-Book" class="bg-dark">E-Book</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-secondary fw-bold tracking-wider">MAIN VIDEO
                                    URL</label>
                                <input type="text"
                                    class="form-control bg-dark bg-opacity-25 text-white border-secondary rounded-3 py-2"
                                    id="video_url" placeholder="Vimeo or YouTube link">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-secondary fw-bold tracking-wider">DEMO VIDEO
                                    URL</label>
                                <input type="text"
                                    class="form-control bg-dark bg-opacity-25 text-white border-secondary rounded-3 py-2"
                                    id="demo_url" placeholder="Watch Demo link">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-secondary fw-bold tracking-wider">INSTRUCTOR</label>
                                <input type="text"
                                    class="form-control bg-dark bg-opacity-25 text-white border-secondary rounded-3 py-2"
                                    id="instructor" value="ShardaHub Expert">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-secondary fw-bold tracking-wider">LEVEL</label>
                                <select
                                    class="form-select bg-dark bg-opacity-25 text-white border-secondary rounded-3 py-2"
                                    id="level">
                                    <option value="Beginner" class="bg-dark">Beginner</option>
                                    <option value="Intermediate" class="bg-dark">Intermediate</option>
                                    <option value="Advanced" class="bg-dark">Advanced</option>
                                    <option value="All Levels" class="bg-dark">All Levels</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-secondary fw-bold tracking-wider">DURATION
                                    (HOURS)</label>
                                <input type="number"
                                    class="form-control bg-dark bg-opacity-25 text-white border-secondary rounded-3 py-2"
                                    id="duration" value="0">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-secondary bg-dark bg-opacity-50 py-3">
                    <button type="button" class="btn btn-outline-light rounded-pill px-4 fw-medium"
                        data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-info rounded-pill px-5 fw-bold shadow-glow"
                        onclick="saveCourse()">
                        <i class="bi bi-cloud-arrow-up-fill me-2"></i> Save Course
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../lib/supabase.js"></script>
    <script src="../assets/js/sharda-db.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/sidebar.js"></script>
    <script src="../assets/js/header.js"></script>
    <script src="../assets/js/footer.js"></script>
    <script src="script.js"></script>
</body>

</html>
