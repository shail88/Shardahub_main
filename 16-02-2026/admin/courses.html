<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Courses | Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/core.css">
</head>

<body class="bg-dark text-white">
    <div id="shardahub-sidebar"></div>

    <div class="main-wrapper">
        <header
            class="py-3 px-4 d-flex justify-content-between align-items-center border-bottom border-secondary glass sticky-top">
            <h1 class="h4 mb-0 fw-bold"><i class="bi bi-mortarboard text-info me-2"></i>Course Management</h1>
            <button class="btn btn-info rounded-pill px-4 fw-bold" data-bs-toggle="modal" data-bs-target="#courseModal"
                onclick="resetForm()">
                <i class="bi bi-plus-lg"></i> Add New Course
            </button>
        </header>

        <div class="container-fluid py-5 px-md-5">
            <div id="courseList" class="row">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-info" role="status"></div>
                    <p class="mt-3 text-secondary">Loading courses...</p>
                </div>
            </div>
        </div>

        <div id="shardahub-footer"></div>
    </div>

    <!-- Course Modal -->
    <div class="modal fade" id="courseModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content glass border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title fw-bold">Course Details</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="courseForm">
                        <input type="hidden" id="courseId">
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label small text-secondary">COURSE TITLE</label>
                                <input type="text" class="form-control bg-transparent text-white border-secondary"
                                    id="title" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-secondary">PRICE (INR)</label>
                                <input type="number" class="form-control bg-transparent text-white border-secondary"
                                    id="price" value="0" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label small text-secondary">DESCRIPTION</label>
                                <textarea class="form-control bg-transparent text-white border-secondary"
                                    id="description" rows="3"></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-secondary">THUMBNAIL URL</label>
                                <input type="text" class="form-control bg-transparent text-white border-secondary"
                                    id="thumbnail_url">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-secondary">CATEGORY</label>
                                <select class="form-select bg-transparent text-white border-secondary" id="category">
                                    <option value="Development" class="bg-dark">Development</option>
                                    <option value="Design" class="bg-dark">Design</option>
                                    <option value="Business" class="bg-dark">Business</option>
                                    <option value="AI" class="bg-dark">AI</option>
                                    <option value="E-Book" class="bg-dark">E-Book</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-secondary">MAIN VIDEO URL (Vimeo/YT Embed)</label>
                                <input type="text" class="form-control bg-transparent text-white border-secondary"
                                    id="video_url">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-secondary">DEMO VIDEO URL</label>
                                <input type="text" class="form-control bg-transparent text-white border-secondary"
                                    id="demo_url">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-outline-light rounded-pill px-4"
                        data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-info rounded-pill px-4 fw-bold" onclick="saveCourse()">Save
                        Course</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/sharda-db.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/sidebar.js"></script>
    <script src="../assets/js/footer.js"></script>
    <script src="script.js"></script>
    <script>
        const form = document.getElementById('courseForm');
        let modal;

        document.addEventListener('DOMContentLoaded', () => {
            modal = new bootstrap.Modal(document.getElementById('courseModal'));
        });

        function resetForm() {
            form.reset();
            document.getElementById('courseId').value = '';
        }

        async function saveCourse() {
            const id = document.getElementById('courseId').value;
            const courseData = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                price: parseFloat(document.getElementById('price').value),
                thumbnail_url: document.getElementById('thumbnail_url').value,
                category: document.getElementById('category').value,
                video_url: document.getElementById('video_url').value,
                demo_url: document.getElementById('demo_url').value,
                is_free: parseFloat(document.getElementById('price').value) === 0
            };

            let error;
            if (id) {
                const { error: err } = await ShardaDB.updateCourse(id, courseData);
                error = err;
            } else {
                const { data, error: err } = await ShardaDB.addCourse(courseData);
                error = err;
            }

            if (error) {
                alert("Error saving course: " + error);
            } else {
                modal.hide();
                loadAdminCourses();
            }
        }

        async function editCourse(id) {
            const course = await ShardaDB.getCourseById(id);
            if (course) {
                document.getElementById('courseId').value = course.id;
                document.getElementById('title').value = course.title;
                document.getElementById('description').value = course.description;
                document.getElementById('price').value = course.price;
                document.getElementById('thumbnail_url').value = course.thumbnail_url || '';
                document.getElementById('category').value = course.category;
                document.getElementById('video_url').value = course.video_url || '';
                document.getElementById('demo_url').value = course.demo_url || '';
                modal.show();
            }
        }

        async function deleteCourse(id) {
            if (confirm("Are you sure you want to delete this course?")) {
                const { error } = await ShardaDB.deleteCourse(id);
                if (error) alert("Error deleting: " + error);
                else loadAdminCourses();
            }
        }
    </script>
</body>

</html>
