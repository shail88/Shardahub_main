<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard | ShardaHub Education</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- ShardaHub Core Assets -->
    <link rel="stylesheet" href="../assets/css/core.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Dynamic Sidebar Integration -->
    <div id="shardahub-sidebar"></div>

    <div class="main-wrapper">
        <header
            class="py-3 px-4 d-flex justify-content-between align-items-center border-bottom border-secondary glass sticky-top">
            <h1 class="h4 mb-0 fw-bold">Student Dashboard</h1>
            <div class="d-flex gap-3 align-items-center">
                <a href="../checkout.html" class="btn btn-sm btn-dark border-secondary rounded-pill px-3">
                    <i class="bi bi-cart3"></i> Cart
                </a>
                <div class="dropdown">
                    <button class="btn btn-sm btn-dark border-secondary rounded-pill px-3 dropdown-toggle" type="button"
                        data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle"></i> My Account
                    </button>
                    <ul class="dropdown-menu dropdown-menu-dark">
                        <li><a class="dropdown-item" href="#">Profile</a></li>
                        <li><a class="dropdown-item" href="#">Settings</a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li><a class="dropdown-item" href="index.html">Sign Out</a></li>
                    </ul>
                </div>
            </div>
        </header>

        <div class="container-fluid py-5 px-md-5">
            <h2 class="fw-bold mb-4">My Learning Journey</h2>

            <!-- Stats -->
            <div class="row g-4 mb-5">
                <div class="col-md-4">
                    <div class="glass p-4 rounded-4 h-100 border-start border-primary border-4">
                        <div class="d-flex align-items-center">
                            <div class="bg-primary bg-opacity-10 p-3 rounded-circle me-3 text-primary">
                                <i class="bi bi-book fs-3"></i>
                            </div>
                            <div>
                                <h3 class="mb-0 fw-bold" id="enrolledCount">0</h3>
                                <small class="text-secondary">Enrolled Courses</small>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="glass p-4 rounded-4 h-100 border-start border-success border-4">
                        <div class="d-flex align-items-center">
                            <div class="bg-success bg-opacity-10 p-3 rounded-circle me-3 text-success">
                                <i class="bi bi-trophy fs-3"></i>
                            </div>
                            <div>
                                <h3 class="mb-0 fw-bold">0</h3>
                                <small class="text-secondary">Certificates Earned</small>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="glass p-4 rounded-4 h-100 border-start border-warning border-4">
                        <div class="d-flex align-items-center">
                            <div class="bg-warning bg-opacity-10 p-3 rounded-circle me-3 text-warning">
                                <i class="bi bi-clock-history fs-3"></i>
                            </div>
                            <div>
                                <h3 class="mb-0 fw-bold">0h</h3>
                                <small class="text-secondary">Total Learn Time</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Course Grid -->
            <h4 class="fw-bold mb-4">Courses In Progress</h4>
            <div class="row g-4" id="dashboardGrid">
                <!-- Loaded by JS -->
                <div class="col-12 text-center py-5 text-secondary glass rounded-4">
                    <i class="bi bi-journal-x display-4 mb-3"></i>
                    <p>You haven't enrolled in any courses yet.</p>
                    <a href="index.html" class="btn btn-primary rounded-pill px-4 fw-bold">Browse Catalog</a>
                </div>
            </div>

            <div id="shardahub-footer"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/sidebar.js"></script>
    <script src="../assets/js/footer.js"></script>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>


</html>
