<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | ShardaHub Ecosystem</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- ShardaHub Core Assets -->
    <link rel="stylesheet" href="assets/css/core.css">
    <style>
        body {
            background: radial-gradient(circle at top right, rgba(139, 92, 246, 0.1) 0%, rgba(15, 23, 42, 1) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            width: 100%;
            max-width: 480px;
            padding: 3rem;
        }

        .form-control-auth {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
        }
    </style>
</head>

<body>
    <div class="glass auth-card rounded-4">
        <div class="text-center mb-5">
            <a href="index.html" class="text-decoration-none">
                <i class="bi bi-layers-half fs-1 text-gradient"></i>
                <h2 class="fw-bold text-white mt-2">Join ShardaHub</h2>
            </a>
            <p class="text-secondary">One account for all our digital platforms.</p>
        </div>

        <form>
            <div class="row g-3 mb-4">
                <div class="col">
                    <label class="form-label text-secondary small">FIRST NAME</label>
                    <input type="text" class="form-control form-control-auth" placeholder="John">
                </div>
                <div class="col">
                    <label class="form-label text-secondary small">LAST NAME</label>
                    <input type="text" class="form-control form-control-auth" placeholder="Doe">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary small">EMAIL ADDRESS</label>
                <input type="email" class="form-control form-control-auth" placeholder="name@company.com">
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary small">PASSWORD</label>
                <input type="password" class="form-control form-control-auth" placeholder="Create a strong password">
            </div>
            <div class="mb-4">
                <div class="form-check">
                    <input class="form-check-input bg-transparent border-secondary" type="checkbox" id="terms" required>
                    <label class="form-check-label text-secondary small" for="terms">I agree to the Terms of Service &
                        Privacy Policy</label>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 rounded-pill py-3 fw-bold glow-effect">Create
                Account</button>
        </form>

        <div class="text-center mt-5">
            <p class="text-secondary small">Already have an account? <a href="login.html"
                    class="text-info text-decoration-none fw-bold">Sign In</a></p>
        </div>
    </div>

    <script src="assets/js/sharda-db.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        document.querySelector('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = e.target.querySelector('input[type="email"]').value;
            const firstName = e.target.querySelectorAll('input')[0].value;
            const lastName = e.target.querySelectorAll('input')[1].value;
            const password = e.target.querySelectorAll('input')[3].value;

            const userData = {
                email,
                full_name: `${firstName} ${lastName}`,
                password,
                role: 'Registered'
            };

            const result = await ShardaDB.saveUser(userData, { ai_credits: 10, subscription_status: 'none' });
            if (result) {
                alert("Account created successfully! Please login.");
                window.location.href = 'login.html';
            }
        });
    </script>
</body>

</html>
