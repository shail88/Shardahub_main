<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — ShardaHub Robotics</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #060b14;
            color: #e2e8f0
        }

        .glass {
            background: rgba(255, 255, 255, .04);
            border: 1px solid rgba(255, 255, 255, .08);
            backdrop-filter: blur(12px)
        }

        .step-indicator {
            display: flex;
            gap: 0;
            margin-bottom: 2rem
        }

        .step {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-size: .8rem;
            position: relative
        }

        .step::after {
            content: '';
            position: absolute;
            top: 50%;
            right: -1px;
            width: 2px;
            height: 60%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, .1)
        }

        .step.active {
            background: rgba(14, 165, 233, .15);
            border-bottom: 2px solid #0ea5e9;
            color: #0ea5e9;
            font-weight: 700
        }

        .step.done {
            background: rgba(16, 185, 129, .1);
            border-bottom: 2px solid #10b981;
            color: #10b981
        }

        .btn-orange {
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            border: none;
            color: #fff
        }

        .btn-orange:hover {
            opacity: .9;
            color: #fff
        }

        .form-control-dark {
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .1);
            color: #e2e8f0;
            border-radius: 10px;
            padding: 10px 14px
        }

        .form-control-dark:focus {
            background: rgba(255, 255, 255, .08);
            border-color: #0ea5e9;
            color: #e2e8f0;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, .15);
            outline: none
        }

        .form-check-input:checked {
            background-color: #0ea5e9;
            border-color: #0ea5e9
        }

        .address-card {
            border: 2px solid rgba(255, 255, 255, .08);
            border-radius: 14px;
            padding: 16px;
            cursor: pointer;
            transition: all .2s
        }

        .address-card.selected {
            border-color: #0ea5e9;
            background: rgba(14, 165, 233, .08)
        }

        .order-item-img {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 10px
        }

        .delivery-badge {
            font-size: .72rem;
            background: rgba(16, 185, 129, .15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, .3);
            padding: 2px 8px;
            border-radius: 50px
        }
    </style>
</head>

<body>
    <div id="headerPlaceholder"></div>
    <div class="container py-5" style="max-width:1000px">

        <!-- Steps -->
        <div class="glass rounded-3 step-indicator overflow-hidden mb-5">
            <div class="step done" id="step1Ind"><i class="bi bi-bag me-1"></i>Cart</div>
            <div class="step active" id="step2Ind"><i class="bi bi-geo-alt me-1"></i>Address</div>
            <div class="step" id="step3Ind"><i class="bi bi-credit-card me-1"></i>Payment</div>
            <div class="step" id="step4Ind"><i class="bi bi-check-circle me-1"></i>Confirm</div>
        </div>

        <div class="row g-4">
            <!-- Left: Steps Content -->
            <div class="col-lg-7">

                <!-- Step 2: Address -->
                <div id="stepAddress">
                    <h5 class="fw-bold mb-4"><i class="bi bi-geo-alt-fill text-info me-2"></i>Delivery Address</h5>

                    <!-- Saved addresses -->
                    <div id="savedAddresses" class="mb-4"></div>

                    <!-- New address form -->
                    <div class="glass rounded-4 p-4" id="newAddressForm">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h6 class="fw-bold mb-0">Add New Address</h6>
                            <div class="form-check form-switch mb-0">
                                <input class="form-check-input" type="checkbox" id="saveAddr" checked>
                                <label class="form-check-label small text-secondary" for="saveAddr">Save for
                                    later</label>
                            </div>
                        </div>
                        <div class="row g-3">
                            <div class="col-12"><input type="text" id="fullName" class="form-control-dark w-100"
                                    placeholder="Full Name *"></div>
                            <div class="col-12"><input type="tel" id="mobile" class="form-control-dark w-100"
                                    placeholder="Mobile Number * (10 digits)"></div>
                            <div class="col-12"><input type="text" id="addr1" class="form-control-dark w-100"
                                    placeholder="Address Line 1 *"></div>
                            <div class="col-12"><input type="text" id="addr2" class="form-control-dark w-100"
                                    placeholder="Address Line 2 (optional)"></div>
                            <div class="col-6"><input type="text" id="city" class="form-control-dark w-100"
                                    placeholder="City *"></div>
                            <div class="col-6"><input type="text" id="pincode" class="form-control-dark w-100"
                                    placeholder="Pincode *"></div>
                            <div class="col-6">
                                <select id="stateSelect" class="form-control-dark w-100">
                                    <option value="">Select State *</option>
                                    ${['Andhra
                                    Pradesh','Bihar','Delhi','Gujarat','Karnataka','Kerala','Maharashtra','Rajasthan','Tamil
                                    Nadu','Telangana','Uttar Pradesh','West Bengal'].map(s=>`<option>${s}</option>
                                    `).join('')}
                                </select>
                            </div>
                            <div class="col-6">
                                <select id="countrySelect" class="form-control-dark w-100">
                                    <option>India</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Delivery options -->
                    <div class="glass rounded-4 p-4 mt-3">
                        <h6 class="fw-bold mb-3">Delivery Speed</h6>
                        <div class="d-flex flex-column gap-2">
                            <label class="d-flex align-items-center gap-3 p-3 rounded-3"
                                style="background:rgba(255,255,255,.03);cursor:pointer">
                                <input type="radio" name="delivery" value="standard" checked
                                    class="form-check-input mt-0">
                                <div class="flex-grow-1">
                                    <div class="fw-semibold small">Standard Delivery</div>
                                    <div class="text-secondary small">5–7 business days</div>
                                </div>
                                <span class="text-success fw-bold small">FREE</span>
                            </label>
                            <label class="d-flex align-items-center gap-3 p-3 rounded-3"
                                style="background:rgba(255,255,255,.03);cursor:pointer">
                                <input type="radio" name="delivery" value="express" class="form-check-input mt-0">
                                <div class="flex-grow-1">
                                    <div class="fw-semibold small">Express Delivery</div>
                                    <div class="text-secondary small">2–3 business days</div>
                                </div>
                                <span class="text-info fw-bold small">₹99</span>
                            </label>
                            <label class="d-flex align-items-center gap-3 p-3 rounded-3"
                                style="background:rgba(255,255,255,.03);cursor:pointer">
                                <input type="radio" name="delivery" value="overnight" class="form-check-input mt-0">
                                <div class="flex-grow-1">
                                    <div class="fw-semibold small">Overnight Delivery</div>
                                    <div class="text-secondary small">Next business day</div>
                                </div>
                                <span class="text-warning fw-bold small">₹249</span>
                            </label>
                        </div>
                    </div>

                    <button class="btn btn-orange w-100 rounded-pill fw-bold py-3 mt-4 fs-6"
                        onclick="proceedToPayment()">
                        Continue to Payment <i class="bi bi-arrow-right ms-2"></i>
                    </button>
                </div>
            </div>

            <!-- Right: Order Summary -->
            <div class="col-lg-5">
                <div class="glass rounded-4 p-4 sticky-top" style="top:80px">
                    <h6 class="fw-bold mb-3">Order Summary</h6>
                    <div id="orderSummaryItems"></div>
                    <hr class="border-secondary">
                    <div class="d-flex justify-content-between small text-secondary mb-1">
                        <span>Subtotal</span><span id="subtotalAmt">₹0</span>
                    </div>
                    <div class="d-flex justify-content-between small text-secondary mb-1">
                        <span>Delivery</span><span id="deliveryAmt" class="text-success">Free</span>
                    </div>
                    <div class="d-flex justify-content-between small text-secondary mb-2">
                        <span>GST (18%)</span><span id="gstAmt">₹0</span>
                    </div>
                    <hr class="border-secondary">
                    <div class="d-flex justify-content-between fw-bold fs-5">
                        <span>Total</span><span class="text-white" id="grandTotal">₹0</span>
                    </div>

                    <!-- Coupon -->
                    <div class="mt-3">
                        <div class="d-flex gap-2">
                            <input type="text" id="couponInput" class="form-control-dark flex-grow-1"
                                placeholder="Coupon code">
                            <button class="btn btn-sm btn-outline-info rounded-pill px-3"
                                onclick="applyCoupon()">Apply</button>
                        </div>
                        <div id="couponMsg" class="small mt-1"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footerPlaceholder"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../lib/supabase.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/header.js"></script>
    <script src="../assets/js/footer.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="../assets/js/payments.js"></script>
    <script>
        window.ShardaBaseUrl = '../';
        let cart = JSON.parse(localStorage.getItem('sharda_robotic_checkout') || '[]');
        let discountAmt = 0;
        let deliveryCharge = 0;

        async function init() {
            await new Promise(r => { if (window.SubpassAuth?.ready) window.SubpassAuth.ready.then(r); else setTimeout(r, 800); });
            const user = window.SubpassAuth?.user;
            if (!user) { window.location.href = '../login.html?redirect=' + encodeURIComponent(location.href); return; }
            if (!cart.length) { window.location.href = 'index.html'; return; }

            renderSummary();
            loadSavedAddresses(user.id);
        }

        function renderSummary() {
            const subtotal = cart.reduce((a, c) => a + (c.price * (c.qty || 1)), 0);
            const gst = Math.round(subtotal * 0.18);
            const grand = subtotal + gst + deliveryCharge - discountAmt;

            document.getElementById('orderSummaryItems').innerHTML = cart.map(item => `
  <div class="d-flex gap-3 mb-3">
    <img src="${sanitizeImg(item.imageUrl)}" class="order-item-img" alt="" onerror="this.onerror=null; this.src=window.SHARDA_PLACEHOLDER;">
    <div class="flex-grow-1">
      <div class="small fw-semibold">${item.title}</div>
      <div class="small text-secondary">Qty: ${item.qty || 1}</div>
      <div class="small text-info fw-bold">₹${(item.price * (item.qty || 1)).toLocaleString()}</div>
    </div>
  </div>`).join('');

            document.getElementById('subtotalAmt').textContent = '₹' + subtotal.toLocaleString();
            document.getElementById('gstAmt').textContent = '₹' + gst.toLocaleString();
            document.getElementById('grandTotal').textContent = '₹' + grand.toLocaleString();
            document.getElementById('deliveryAmt').textContent = deliveryCharge > 0 ? '₹' + deliveryCharge : 'Free';
        }

        async function loadSavedAddresses(userId) {
            const { data: addrs } = await supabase.from('shipping_addresses').select('*').eq('user_id', userId).order('is_default', { ascending: false });
            const container = document.getElementById('savedAddresses');
            if (!addrs || !addrs.length) { container.innerHTML = ''; return; }
            container.innerHTML = `<h6 class="fw-bold mb-2 small">Saved Addresses</h6>` +
                addrs.map(a => `
  <div class="address-card mb-2 ${a.is_default ? 'selected' : ''}" onclick="selectSavedAddress(this,'${a.id}')">
    <div class="d-flex justify-content-between">
      <div class="fw-semibold small">${a.full_name}</div>
      ${a.is_default ? '<span class="delivery-badge">Default</span>' : ''}
    </div>
    <div class="text-secondary small">${a.address_line1}${a.address_line2 ? ', ' + a.address_line2 : ''}, ${a.city}, ${a.state} - ${a.pincode}</div>
    <div class="text-secondary small"><i class="bi bi-telephone me-1"></i>${a.mobile}</div>
  </div>`).join('');
        }

        let selectedAddressId = null;
        function selectSavedAddress(el, id) {
            document.querySelectorAll('.address-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            selectedAddressId = id;
            document.getElementById('newAddressForm').style.opacity = '0.4';
        }

        document.querySelectorAll('input[name="delivery"]').forEach(r => r.addEventListener('change', e => {
            deliveryCharge = e.target.value === 'express' ? 99 : e.target.value === 'overnight' ? 249 : 0;
            renderSummary();
        }));

        async function applyCoupon() {
            const code = document.getElementById('couponInput').value.trim().toUpperCase();
            const msgEl = document.getElementById('couponMsg');
            if (!code) { msgEl.textContent = 'Enter a coupon code'; msgEl.className = 'small mt-1 text-warning'; return; }
            const { data: coupon } = await supabase.from('coupons').select('*').eq('code', code).eq('is_active', true).single();
            if (!coupon) { msgEl.textContent = 'Invalid or expired coupon'; msgEl.className = 'small mt-1 text-danger'; return; }
            const subtotal = cart.reduce((a, c) => a + (c.price * (c.qty || 1)), 0);
            discountAmt = coupon.discount_type === 'percent' ? Math.round(subtotal * coupon.discount_value / 100) : coupon.discount_value;
            msgEl.textContent = '🎉 Coupon applied! Saved ₹' + discountAmt;
            msgEl.className = 'small mt-1 text-success';
            renderSummary();
        }

        async function proceedToPayment() {
            const user = window.SubpassAuth?.user;
            if (!user) return;

            // Validate / save address
            let shipAddrId = selectedAddressId;
            if (!shipAddrId) {
                const fn = document.getElementById('fullName').value.trim();
                const mob = document.getElementById('mobile').value.trim();
                const a1 = document.getElementById('addr1').value.trim();
                const city = document.getElementById('city').value.trim();
                const pin = document.getElementById('pincode').value.trim();
                const state = document.getElementById('stateSelect').value;
                if (!fn || !mob || !a1 || !city || !pin || !state) {
                    ShardaPayments.showToast('Please fill all required address fields', 'warning'); return;
                }
                if (!/^\d{10}$/.test(mob)) { ShardaPayments.showToast('Enter valid 10-digit mobile number', 'warning'); return; }
                if (!/^\d{6}$/.test(pin)) { ShardaPayments.showToast('Enter valid 6-digit pincode', 'warning'); return; }

                const addrData = {
                    user_id: user.id, full_name: fn, mobile: mob, address_line1: a1,
                    address_line2: document.getElementById('addr2').value.trim() || null,
                    city, state, pincode: pin, country: 'India', is_default: false
                };
                if (document.getElementById('saveAddr').checked) {
                    const { data: saved } = await supabase.from('shipping_addresses').insert([addrData]).select().single();
                    shipAddrId = saved?.id;
                }
                localStorage.setItem('sharda_shipping', JSON.stringify({ ...addrData, id: shipAddrId }));
            } else {
                const { data: addr } = await supabase.from('shipping_addresses').select('*').eq('id', shipAddrId).single();
                localStorage.setItem('sharda_shipping', JSON.stringify(addr));
            }

            // Build items for Razorpay
            const subtotal = cart.reduce((a, c) => a + (c.price * (c.qty || 1)), 0);
            const gst = Math.round(subtotal * 0.18);
            const total = subtotal + gst + deliveryCharge - discountAmt;

            ShardaPayments.initiateCheckout({
                items: cart.map(c => ({ id: c.id, name: c.title, price: c.price * (c.qty || 1), qty: c.qty || 1 })),
                totalAmount: total,
                section: 'robotic',
                shippingAddressId: shipAddrId,
                onSuccess: () => {
                    localStorage.removeItem('sharda_robotic_cart');
                    localStorage.removeItem('sharda_robotic_checkout');
                    window.location.href = 'orders.html?ordered=1';
                }
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
