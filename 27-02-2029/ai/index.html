<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tools — ShardaHub</title>
    <meta name="description"
        content="Unlock powerful AI tools with multi-tier access plans. Free, Basic, Pro and Enterprise.">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --ai-accent: #0ea5e9;
            --purple: #8b5cf6;
            --gold: #f59e0b
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #060b14;
            color: #e2e8f0
        }

        .glass {
            background: rgba(255, 255, 255, .04);
            border: 1px solid rgba(255, 255, 255, .08);
            backdrop-filter: blur(12px)
        }

        .tier-card {
            border: 2px solid rgba(255, 255, 255, .08);
            border-radius: 20px;
            transition: all .3s;
            position: relative;
            overflow: hidden
        }

        .tier-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 24px 60px rgba(14, 165, 233, .25)
        }

        .tier-card.popular {
            border-color: var(--ai-accent);
            box-shadow: 0 0 30px rgba(14, 165, 233, .2)
        }

        .popular-badge {
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            color: #fff;
            font-size: .7rem;
            font-weight: 700;
            padding: 4px 16px;
            border-radius: 0 0 10px 10px;
            letter-spacing: .05em
        }

        .feature-check {
            color: #10b981
        }

        .feature-x {
            color: rgba(255, 255, 255, .2)
        }

        .btn-gradient {
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            border: none;
            color: #fff
        }

        .btn-gradient:hover {
            opacity: .9;
            color: #fff
        }

        .ai-tool-card {
            cursor: pointer;
            transition: all .25s;
            border-radius: 16px
        }

        .ai-tool-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 40px rgba(14, 165, 233, .2)
        }

        .hero-bg {
            background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(14, 165, 233, .12) 0%, transparent 70%)
        }

        .toggle-btn.active {
            background: rgba(14, 165, 233, .2);
            color: var(--ai-accent);
            border-color: var(--ai-accent)
        }
    </style>
</head>

<body>
    <div id="headerPlaceholder"></div>

    <!-- Hero -->
    <section class="hero-bg py-5">
        <div class="container py-4 text-center">
            <span
                class="badge bg-info bg-opacity-15 text-info border border-info border-opacity-25 rounded-pill px-3 py-2 mb-3">
                <i class="bi bi-robot me-1"></i>AI Lab
            </span>
            <h1 class="display-5 fw-bold mb-3">Supercharge with <span style="color:var(--ai-accent)">AI Tools</span>
            </h1>
            <p class="text-secondary lead mb-4">Resume builder, image generator, code assistant, content writer & more.
            </p>
            <div id="userTierBadge" class="d-none"></div>
        </div>
    </section>

    <!-- Tool Cards -->
    <section class="py-4">
        <div class="container">
            <h5 class="fw-bold mb-4">Available AI Tools</h5>
            <div id="aiToolGrid" class="row g-3">
                <div class="col-12 text-center py-4">
                    <div class="spinner-border text-info" role="status"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Pricing Plans -->
    <section class="py-5" id="pricing">
        <div class="container">
            <div class="text-center mb-5">
                <h2 class="fw-bold mb-2">Choose Your Plan</h2>
                <p class="text-secondary">Upgrade anytime. Cancel anytime.</p>
                <!-- Monthly/Annual Toggle -->
                <div class="d-flex align-items-center justify-content-center gap-3 mt-3">
                    <span class="small text-secondary">Monthly</span>
                    <div class="form-check form-switch mb-0">
                        <input class="form-check-input" type="checkbox" id="annualToggle" role="switch"
                            style="width:3rem;height:1.5rem">
                    </div>
                    <span class="small text-secondary">Annual <span class="badge bg-success">Save 30%</span></span>
                </div>
            </div>

            <div class="row g-4 justify-content-center" id="tierCards">
                <div class="col-12 text-center py-4">
                    <div class="spinner-border text-info" role="status"></div>
                </div>
            </div>

            <!-- Comparison Table -->
            <div class="mt-5">
                <h5 class="fw-bold text-center mb-4">Full Feature Comparison</h5>
                <div class="table-responsive">
                    <table class="table table-dark table-hover align-middle" id="compareTable">
                        <thead></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <div id="footerPlaceholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../lib/supabase.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/header.js"></script>
    <script src="../assets/js/footer.js"></script>
    <script src="../assets/js/sharda-db.js"></script>
    <script src="../assets/js/sharda-access.js"></script>
    <script src="../assets/js/payments.js"></script>
    <script>
        window.ShardaBaseUrl = '../';
        let isAnnual = false;

        const STATIC_TIERS = [
            { level: 1, name: 'Free', monthlyPrice: 0, annualPrice: 0, highlight: 'rgba(16,185,129,.08)', border: 'rgba(16,185,129,.3)', icon: 'bi-stars', color: '#10b981', dailyLimit: 5, monthlyLimit: 50, features: ['5 AI generations/day', '50/month total', 'Resume Builder (basic)', 'Image Generator (5/day)', 'Watermarked outputs', 'Community support'], popular: false, isFree: true },
            { level: 2, name: 'Basic', monthlyPrice: 499, annualPrice: 349, highlight: 'rgba(14,165,233,.08)', border: 'rgba(14,165,233,.3)', icon: 'bi-lightning', color: '#0ea5e9', dailyLimit: 50, monthlyLimit: 500, features: ['50 generations/day', '500/month total', 'All 8 AI tools', 'No watermarks', 'Priority queue', 'Email support'], popular: false, isFree: false },
            { level: 3, name: 'Pro', monthlyPrice: 1499, annualPrice: 999, highlight: 'rgba(139,92,246,.08)', border: 'rgba(139,92,246,.3)', icon: 'bi-rocket', color: '#8b5cf6', dailyLimit: 200, monthlyLimit: 3000, features: ['200 generations/day', '3,000/month total', 'Everything in Basic', 'API access (beta)', 'Custom styles', 'Priority support'], popular: true, isFree: false },
            { level: 4, name: 'Enterprise', monthlyPrice: 4999, annualPrice: 3499, highlight: 'rgba(245,158,11,.08)', border: 'rgba(245,158,11,.3)', icon: 'bi-building', color: '#f59e0b', dailyLimit: -1, monthlyLimit: -1, features: ['Unlimited generations', 'All AI tools + new releases', 'Dedicated API', 'White-label output', 'Team seats (5)', 'Dedicated manager'], popular: false, isFree: false }
        ];

        async function init() {
            await waitForAuth();
            loadAiTools();
            renderTierCards();
        }

        async function loadAiTools() {
            const { data } = await supabase.from('products').select('*').eq('product_type', 'ai').eq('is_active', true);
            const tools = data || [];
            const user = window.SubpassAuth?.user;
            const grid = document.getElementById('aiToolGrid');

            if (!tools.length) {
                // Fallback static tools
                const staticTools = [
                    { id: 'resume-ai', title: 'Resume Builder', tagline: 'AI-powered professional resumes', icon: 'bi-file-person', color: '#0ea5e9' },
                    { id: 'image-ai', title: 'Image Generator', tagline: 'Create stunning visuals from text', icon: 'bi-image', color: '#8b5cf6' },
                    { id: 'code-ai', title: 'Code Assistant', tagline: 'Write, debug and explain code', icon: 'bi-code-slash', color: '#10b981' },
                    { id: 'content-ai', title: 'Content Writer', tagline: 'Blog posts, ads, emails & more', icon: 'bi-pencil-square', color: '#f59e0b' },
                ];
                grid.innerHTML = staticTools.map(t => `
      <div class="col-sm-6 col-lg-3">
        <div class="glass ai-tool-card p-4 h-100" onclick="window.location.href='dashboard.html?tool=${t.id}'">
          <div class="rounded-3 d-inline-flex p-3 mb-3" style="background:${t.color}22">
            <i class="bi ${t.icon} fs-3" style="color:${t.color}"></i>
          </div>
          <h6 class="fw-bold mb-1">${t.title}</h6>
          <p class="text-secondary small mb-0">${t.tagline}</p>
        </div>
      </div>`).join('');
                return;
            }

            grid.innerHTML = tools.map(t => `
    <div class="col-sm-6 col-lg-3">
      <div class="glass ai-tool-card p-4 h-100" onclick="window.location.href='dashboard.html?tool=${t.id}'">
        <div class="rounded-3 d-inline-flex p-3 mb-3" style="background:rgba(14,165,233,.12)">
          <i class="bi ${t.icon || 'bi-robot'} fs-3 text-info"></i>
        </div>
        <h6 class="fw-bold mb-1">${t.title}</h6>
        <p class="text-secondary small mb-2">${t.tagline || ''}</p>
        <span class="badge ${t.price_inr === 0 ? 'bg-success' : 'bg-info'} bg-opacity-15 text-${t.price_inr === 0 ? 'success' : 'info'}">
          ${t.price_inr === 0 ? 'Free' : 'From ₹' + t.price_inr}
        </span>
      </div>
    </div>`).join('');
        }

        function renderTierCards() {
            const container = document.getElementById('tierCards');
            container.innerHTML = STATIC_TIERS.map(t => {
                const price = isAnnual ? t.annualPrice : t.monthlyPrice;
                const ogPrice = isAnnual && !t.isFree ? t.monthlyPrice : null;
                return `
    <div class="col-md-6 col-lg-3">
      <div class="tier-card p-4 h-100 d-flex flex-column" style="background:${t.highlight};border-color:${t.border}">
        ${t.popular ? '<div class="popular-badge">⭐ MOST POPULAR</div>' : ''}
        <div class="rounded-3 d-inline-flex p-3 mb-3" style="background:${t.color}22;width:fit-content">
          <i class="bi ${t.icon} fs-3" style="color:${t.color}"></i>
        </div>
        <h5 class="fw-bold mb-1">${t.name}</h5>
        <div class="mb-3">
          <span class="display-6 fw-bold" style="color:${t.color}">
            ${price === 0 ? 'Free' : '₹' + price}
          </span>
          ${price > 0 ? `<span class="text-secondary small">/mo${isAnnual ? ' (billed annually)' : ''}</span>` : ''}
          ${ogPrice ? `<div class="text-secondary small text-decoration-line-through">₹${ogPrice}/mo</div>` : ''}
        </div>
        <div class="small text-secondary mb-3">
          <i class="bi bi-bolt me-1" style="color:${t.color}"></i>
          ${t.dailyLimit === -1 ? 'Unlimited' : t.dailyLimit} calls/day
        </div>
        <ul class="list-unstyled flex-grow-1 mb-4">
          ${t.features.map(f => `
          <li class="d-flex align-items-start gap-2 mb-2 small">
            <i class="bi bi-check-circle-fill feature-check mt-1 flex-shrink-0"></i>
            <span>${f}</span>
          </li>`).join('')}
        </ul>
        <button class="btn ${t.popular ? 'btn-gradient' : 'btn-outline-secondary'} rounded-pill w-100 fw-semibold"
                onclick="handleAIPlanSelect('${t.name}',${price},${t.level})">
          ${t.isFree ? 'Get Started Free' : 'Get ' + t.name}
        </button>
      </div>
    </div>`;
            }).join('');
            renderCompareTable();
        }

        function renderCompareTable() {
            const features = ['Daily Calls', 'Monthly Total', 'All 8 AI Tools', 'No Watermarks', 'API Access', 'Custom Styles', 'Team Seats', 'Priority Support'];
            const vals = [
                ['5', '50 total', 'Basic 3 only', '✗', '✗', '✗', '✗', 'Community'],
                ['50', '500 total', '✓', '✓', '✗', '✗', '✗', 'Email'],
                ['200', '3,000 total', '✓', '✓', 'Beta', '✓', '✗', 'Priority'],
                ['Unlimited', 'Unlimited', '✓', '✓', '✓', '✓', '5 seats', 'Dedicated'],
            ];
            const t = document.getElementById('compareTable');
            t.querySelector('thead').innerHTML = `<tr><th>Feature</th>${STATIC_TIERS.map(tier => `<th class="text-center"><span style="color:${tier.color}">${tier.name}</span></th>`).join('')}</tr>`;
            t.querySelector('tbody').innerHTML = features.map((f, fi) => `<tr>
    <td class="text-secondary small">${f}</td>
    ${vals.map((v, vi) => `<td class="text-center small ${v[fi] === '✓' ? 'text-success' : v[fi] === '✗' ? 'text-secondary' : ''}">${v[fi]}</td>`).join('')}
  </tr>`).join('');
        }

        async function handleAIPlanSelect(name, price, level) {
            const user = window.SubpassAuth?.user;
            if (!user) { window.location.href = '../login.html?redirect=' + encodeURIComponent(location.href); return; }
            if (price === 0) { ShardaPayments.showToast('Free plan active — head to AI dashboard!', 'success'); setTimeout(() => window.location.href = 'dashboard.html', 1500); return; }
            await ShardaPayments.quickBuy({
                id: 'ai-subscription', name: 'AI ' + name + ' Plan', price, icon: 'bi-robot',
                tierId: null, durationDays: isAnnual ? 365 : 30
            }, 'ai');
            setTimeout(() => window.location.href = 'dashboard.html', 2000);
        }

        document.getElementById('annualToggle').addEventListener('change', e => {
            isAnnual = e.target.checked; renderTierCards();
        });

        function waitForAuth() { return new Promise(r => { if (window.SubpassAuth?.ready) window.SubpassAuth.ready.then(r); else setTimeout(r, 800); }); }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
