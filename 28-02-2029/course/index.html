<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses — ShardaHub Academy</title>
  <meta name="description"
    content="Learn from expert instructors. Browse free and premium courses on AI, Web Dev, SaaS, Robotics and more.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ai-accent: #0ea5e9;
      --gold: #f59e0b;
      --success: #10b981;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #060b14;
      color: #e2e8f0;
    }

    .glass {
      background: rgba(255, 255, 255, .04);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, .08);
    }

    .course-card {
      transition: transform .25s, box-shadow .25s;
      cursor: pointer;
    }

    .course-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(14, 165, 233, .2);
    }

    .progress-sm {
      height: 5px;
      border-radius: 4px;
    }

    .star-rating .bi {
      color: #e2e8f0;
      font-size: .85rem;
    }

    .star-rating .bi.filled {
      color: var(--gold);
    }

    .badge-free {
      background: rgba(16, 185, 129, .15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, .3);
    }

    .badge-paid {
      background: rgba(14, 165, 233, .15);
      color: #0ea5e9;
      border: 1px solid rgba(14, 165, 233, .3);
    }

    .badge-enrolled {
      background: rgba(139, 92, 246, .15);
      color: #8b5cf6;
      border: 1px solid rgba(139, 92, 246, .3);
    }

    .hero-gradient {
      background: linear-gradient(135deg, #0f172a 0%, #0c1a2e 50%, #071520 100%);
    }

    .filter-pill {
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 50px;
      padding: 6px 16px;
      cursor: pointer;
      font-size: .85rem;
      transition: all .2s;
    }

    .filter-pill:hover,
    .filter-pill.active {
      background: rgba(14, 165, 233, .2);
      border-color: var(--ai-accent);
      color: var(--ai-accent);
    }

    .search-input {
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .12);
      color: #fff;
      border-radius: 12px;
      padding: 10px 20px;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--ai-accent);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, .15);
    }

    .course-thumb {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .btn-gradient {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      border: none;
      color: #fff;
    }

    .btn-gradient:hover {
      opacity: .9;
      color: #fff;
    }
  </style>
</head>

<body>
  <div id="headerPlaceholder"></div>

  <!-- Hero -->
  <section class="hero-gradient py-5">
    <div class="container py-3">
      <div class="text-center mb-5">
        <span
          class="badge bg-info bg-opacity-15 text-info border border-info border-opacity-25 rounded-pill px-3 py-2 mb-3">
          <i class="bi bi-mortarboard me-1"></i>ShardaHub Academy
        </span>
        <h1 class="display-5 fw-bold mb-3">Learn. Build. <span style="color:var(--ai-accent)">Launch.</span>
        </h1>
        <p class="text-secondary lead">Expert-crafted courses on AI, SaaS, Web Dev, Robotics & more.</p>
        <div class="row justify-content-center mt-4">
          <div class="col-md-6">
            <div class="position-relative">
              <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-secondary"></i>
              <input id="searchInput" type="text" class="search-input w-100 ps-5"
                placeholder="Search courses, skills, instructors...">
            </div>
          </div>
        </div>
      </div>

      <!-- Stats -->
      <div class="row g-3 text-center mb-2">
        <div class="col-4 col-md-3">
          <div class="glass rounded-3 p-3">
            <div class="fw-bold fs-4 text-info" id="statCourses">—</div>
            <div class="small text-secondary">Courses</div>
          </div>
        </div>
        <div class="col-4 col-md-3">
          <div class="glass rounded-3 p-3">
            <div class="fw-bold fs-4 text-info" id="statStudents">—</div>
            <div class="small text-secondary">Students</div>
          </div>
        </div>
        <div class="col-4 col-md-3">
          <div class="glass rounded-3 p-3">
            <div class="fw-bold fs-4 text-info" id="statHours">—</div>
            <div class="small text-secondary">Hours</div>
          </div>
        </div>
        <div class="col-12 col-md-3 d-none d-md-block">
          <div class="glass rounded-3 p-3">
            <div class="fw-bold fs-4 text-success">4.8★</div>
            <div class="small text-secondary">Avg Rating</div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Filters -->
  <section class="py-3 border-bottom border-secondary border-opacity-25 sticky-top"
    style="background:#060b14ee;backdrop-filter:blur(12px);z-index:100">
    <div class="container">
      <div class="d-flex gap-2 flex-wrap align-items-center">
        <span class="text-secondary small me-1">Filter:</span>
        <span class="filter-pill active" data-filter="all">All</span>
        <span class="filter-pill" data-filter="free">🆓 Free</span>
        <span class="filter-pill" data-filter="paid">💎 Premium</span>
        <span class="filter-pill" data-filter="enrolled">📚 Enrolled</span>
        <div class="ms-auto d-flex gap-2">
          <select id="levelFilter" class="search-input py-1 px-3 small" style="width:auto">
            <option value="">All Levels</option>
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
          </select>
          <select id="sortFilter" class="search-input py-1 px-3 small" style="width:auto">
            <option value="newest">Newest</option>
            <option value="popular">Most Popular</option>
            <option value="rating">Top Rated</option>
            <option value="price_asc">Price: Low</option>
            <option value="price_desc">Price: High</option>
          </select>
        </div>
      </div>
    </div>
  </section>

  <!-- Course Grid -->
  <section class="py-5">
    <div class="container">
      <div id="courseGrid" class="row g-4">
        <!-- Loading Skeleton -->
        ${[1,2,3,4,5,6].map(()=>`
        <div class="col-md-6 col-lg-4">
          <div class="glass rounded-4 overflow-hidden">
            <div class="bg-secondary bg-opacity-25 text-center py-5" style="height:180px">
              <div class="spinner-border text-info mt-4" role="status"></div>
            </div>
            <div class="p-4">
              <div class="bg-secondary bg-opacity-25 rounded mb-2" style="height:14px;width:80%"></div>
              <div class="bg-secondary bg-opacity-25 rounded" style="height:14px;width:50%"></div>
            </div>
          </div>
        </div>`).join('')}
      </div>
      <div id="noCourses" class="text-center py-5 d-none">
        <i class="bi bi-search display-1 text-secondary mb-3 d-block"></i>
        <h5 class="text-secondary">No courses found</h5>
        <p class="text-secondary small">Try a different search or filter</p>
      </div>
    </div>
  </section>

  <div id="footerPlaceholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../lib/supabase.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/header.js"></script>
  <script src="../assets/js/footer.js"></script>
  <script src="../assets/js/sharda-db.js"></script>
  <script src="../assets/js/sharda-access.js"></script>
  <script src="../assets/js/payments.js"></script>
  <script>
    window.ShardaBaseUrl = '../';

    let allCourses = [];
    let enrollments = [];
    let activeFilter = 'all';

    async function init() {
      const user = await waitForAuth();

      // Load stats
      const [{ count: cCount }, { count: sCount }] = await Promise.all([
        supabase.from('courses').select('*', { count: 'exact', head: true }),
        supabase.from('enrollments').select('*', { count: 'exact', head: true })
      ]);
      document.getElementById('statCourses').textContent = cCount || 0;
      document.getElementById('statStudents').textContent = sCount || 0;

      // Load user enrollments
      if (user) {
        const { data } = await supabase.from('enrollments').select('course_id,progress_percent').eq('user_id', user.id);
        enrollments = data || [];
      }

      // Load all courses with product info
      const { data } = await supabase
        .from('products')
        .select('*, courses(*)')
        .eq('product_type', 'course')
        .eq('is_active', true)
        .order('created_at', { ascending: false });

      allCourses = (data || []).map(p => ({ ...p, ...(p.courses || {}) }));

      // Dynamic Subcategories (Categories)
      const cats = [...new Set(allCourses.map(c => c.category).filter(Boolean))];
      const filterRow = document.querySelector('.filter-pill').parentElement;
      cats.forEach(cat => {
        const pill = document.createElement('span');
        pill.className = 'filter-pill';
        pill.dataset.filter = 'cat:' + cat;
        pill.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
        filterRow.appendChild(pill);
      });

      // Total hours
      const totalHrs = allCourses.reduce((a, c) => a + (c.duration_hours || 0), 0);
      document.getElementById('statHours').textContent = Math.round(totalHrs) + '+';

      renderCourses();
    }

    function renderCourses() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const level = document.getElementById('levelFilter').value;
      const sort = document.getElementById('sortFilter').value;

      let filtered = allCourses.filter(c => {
        const matchSearch = !query ||
          c.title?.toLowerCase().includes(query) ||
          c.instructor_name?.toLowerCase().includes(query);
        const matchLevel = !level || c.level === level;

        let matchFilter = true;
        if (activeFilter === 'free') matchFilter = (c.price_inr === 0);
        else if (activeFilter === 'paid') matchFilter = (c.price_inr > 0);
        else if (activeFilter === 'enrolled') matchFilter = isEnrolled(c.id);
        else if (activeFilter.startsWith('cat:')) {
          const targetCat = activeFilter.split(':')[1];
          matchFilter = (c.category === targetCat);
        }

        return matchSearch && matchLevel && matchFilter;
      });

      // Sort
      if (sort === 'popular') filtered.sort((a, b) => (b.enrollment_count || 0) - (a.enrollment_count || 0));
      if (sort === 'rating') filtered.sort((a, b) => (b.rating || 0) - (a.rating || 0));
      if (sort === 'price_asc') filtered.sort((a, b) => (a.price_inr || 0) - (b.price_inr || 0));
      if (sort === 'price_desc') filtered.sort((a, b) => (b.price_inr || 0) - (a.price_inr || 0));

      const grid = document.getElementById('courseGrid');
      document.getElementById('noCourses').classList.toggle('d-none', filtered.length > 0);

      if (filtered.length === 0) { grid.innerHTML = ''; return; }

      grid.innerHTML = filtered.map(c => {
        const enrolled = isEnrolled(c.id);
        const progress = enrollments.find(e => e.course_id === c.id)?.progress_percent || 0;
        const isFree = c.price_inr === 0;
        const stars = renderStars(c.rating || 4.5);

        return `
    <div class="col-md-6 col-lg-4">
      <div class="glass rounded-4 overflow-hidden course-card h-100 d-flex flex-column"
           onclick="window.location.href='details.html?id=${c.id}'">
        <div class="position-relative overflow-hidden">
          <img src="${c.image_url || 'https://via.placeholder.com/400x180/0f172a/0ea5e9?text=' + encodeURIComponent(c.title)}"
               class="course-thumb w-100" alt="${c.title}" loading="lazy">
          <div class="position-absolute top-0 start-0 p-2 d-flex gap-1">
            <span class="badge ${isFree ? 'badge-free' : 'badge-paid'} small">
              ${isFree ? '🆓 Free' : '💎 Premium'}
            </span>
            ${enrolled ? '<span class="badge badge-enrolled small">✓ Enrolled</span>' : ''}
          </div>
          <div class="position-absolute top-0 end-0 p-2">
            <span class="badge bg-dark bg-opacity-75 small">
              <i class="bi bi-collection-play me-1"></i>${c.total_lessons || 0} lessons
            </span>
          </div>
        </div>

        ${enrolled ? `
        <div class="px-3 pt-2">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <span class="small text-secondary">Progress</span>
            <span class="small fw-bold text-info">${progress}%</span>
          </div>
          <div class="progress progress-sm">
            <div class="progress-bar bg-info" style="width:${progress}%"></div>
          </div>
        </div>` : ''}

        <div class="p-3 flex-grow-1 d-flex flex-column">
          <h6 class="fw-bold text-white mb-1 lh-sm">${c.title}</h6>
          <div class="small text-secondary mb-2">
            <i class="bi bi-person me-1"></i>${c.instructor_name || 'ShardaHub Expert'}
            <span class="mx-2">·</span>
            <i class="bi bi-clock me-1"></i>${c.duration_hours || 0}h
            <span class="mx-2">·</span>${c.level || 'Beginner'}
          </div>
          <div class="d-flex align-items-center gap-2 mb-3">
            <div class="star-rating">${stars}</div>
            <span class="small text-secondary">(${(c.rating_count || 0).toLocaleString()})</span>
          </div>
          <div class="mt-auto d-flex align-items-center justify-content-between">
            <div>
              ${isFree
            ? '<span class="text-success fw-bold">Free</span>'
            : `<span class="fw-bold text-white">₹${c.price_inr?.toLocaleString()}</span>
                   ${c.og_price_inr ? `<span class="text-secondary text-decoration-line-through small ms-2">₹${c.og_price_inr?.toLocaleString()}</span>` : ''}`}
            </div>
            <button class="btn btn-sm ${enrolled ? 'btn-outline-info' : 'btn-gradient'} rounded-pill px-3 fw-medium"
                    onclick="event.stopPropagation(); handleCourseAction('${c.id}','${isFree}','${enrolled}','${c.title}',${c.price_inr})">
              ${enrolled ? '<i class="bi bi-play-fill me-1"></i>Continue' :
            isFree ? '<i class="bi bi-unlock me-1"></i>Enroll Free' :
              '<i class="bi bi-cart-plus me-1"></i>Buy Now'}
            </button>
          </div>
        </div>
      </div>
    </div>`;
      }).join('');
    }

    function isEnrolled(courseId) {
      return enrollments.some(e => e.course_id === courseId);
    }

    function renderStars(rating) {
      return [1, 2, 3, 4, 5].map(i =>
        `<i class="bi bi-star-fill ${i <= Math.round(rating) ? 'filled' : ''}" style="color:${i <= Math.round(rating) ? 'var(--gold)' : 'rgba(255,255,255,.2)'}"></i>`
      ).join('');
    }

    async function handleCourseAction(courseId, isFree, enrolled, title, price) {
      const user = window.SubpassAuth?.user;

      // Already enrolled → go to player
      if (enrolled === 'true') {
        window.location.href = `player.html?course=${courseId}`;
        return;
      }

      if (!user) {
        window.location.href = `login.html?redirect=${encodeURIComponent(window.location.href)}`;
        return;
      }

      // Free course → enroll immediately
      if (isFree === 'true' || parseFloat(price) === 0) {
        const { error } = await supabase.from('enrollments').upsert([{ user_id: user.id, course_id: courseId }]);
        if (!error) {
          ShardaPayments.showToast(`Enrolled in ${title}!`, 'success');
          enrollments.push({ course_id: courseId, progress_percent: 0 });
          renderCourses();
        }
        return;
      }

      // Paid course → Razorpay
      ShardaPayments.addToCart({ id: courseId, name: title, price: parseFloat(price), icon: 'bi-mortarboard', section: 'course' });
    }

    function waitForAuth() {
      return new Promise(resolve => {
        if (window.SubpassAuth?.ready) {
          window.SubpassAuth.ready.then(() => resolve(window.SubpassAuth.user));
        } else {
          setTimeout(() => resolve(window.SubpassAuth?.user || null), 800);
        }
      });
    }

    // Filters & Search
    document.addEventListener('DOMContentLoaded', init);
    document.addEventListener('click', e => {
      if (e.target.matches('.filter-pill')) {
        document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
        e.target.classList.add('active');
        activeFilter = e.target.dataset.filter;
        renderCourses();
      }
    });
    document.addEventListener('input', e => {
      if (e.target.id === 'searchInput') renderCourses();
    });
    document.addEventListener('change', e => {
      if (e.target.id === 'levelFilter' || e.target.id === 'sortFilter') renderCourses();
    });
  </script>
</body>

</html>
