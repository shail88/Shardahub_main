<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games Hub — ShardaHub</title>
    <meta name="description" content="Multi-tier game licensing. Demo, Full Game, Source Code, Enterprise.">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #060b14;
            color: #e2e8f0
        }

        .glass {
            background: rgba(255, 255, 255, .04);
            border: 1px solid rgba(255, 255, 255, .08);
            backdrop-filter: blur(12px)
        }

        .game-card {
            transition: all .3s;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer
        }

        .game-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 50px rgba(139, 92, 246, .3)
        }

        .game-thumb {
            width: 100%;
            height: 200px;
            object-fit: cover
        }

        .tier-badge {
            font-size: .7rem;
            padding: 3px 10px;
            border-radius: 50px
        }

        .tier-demo {
            background: rgba(16, 185, 129, .15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, .3)
        }

        .tier-full {
            background: rgba(14, 165, 233, .15);
            color: #0ea5e9;
            border: 1px solid rgba(14, 165, 233, .3)
        }

        .tier-source {
            background: rgba(139, 92, 246, .15);
            color: #8b5cf6;
            border: 1px solid rgba(139, 92, 246, .3)
        }

        .tier-enterprise {
            background: rgba(245, 158, 11, .15);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, .3)
        }

        .btn-gradient {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            border: none;
            color: #fff
        }

        .btn-gradient:hover {
            opacity: .9;
            color: #fff
        }

        .platform-badge {
            font-size: .65rem
        }

        .hero-bg {
            background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(139, 92, 246, .12) 0%, transparent 70%)
        }
    </style>
</head>

<body>
    <div id="headerPlaceholder"></div>

    <section class="hero-bg py-5">
        <div class="container py-3 text-center">
            <span class="badge rounded-pill px-3 py-2 mb-3"
                style="background:rgba(139,92,246,.15);color:#8b5cf6;border:1px solid rgba(139,92,246,.3)">
                <i class="bi bi-controller me-1"></i>Games Hub
            </span>
            <h1 class="display-5 fw-bold mb-3">Play. License. <span style="color:#8b5cf6">Build.</span></h1>
            <p class="text-secondary lead">From demo play to full source code licensing — choose your tier.</p>
        </div>
    </section>

    <!-- Tier Legend -->
    <section class="py-3 border-bottom border-secondary border-opacity-25">
        <div class="container">
            <div class="d-flex gap-3 flex-wrap align-items-center justify-content-center">
                <span class="small text-secondary me-2">License Tiers:</span>
                <span class="tier-badge tier-demo">🆓 Demo</span>
                <span class="tier-badge tier-full">🎮 Full Game</span>
                <span class="tier-badge tier-source">💻 + Source Code</span>
                <span class="tier-badge tier-enterprise">🏢 Enterprise</span>
            </div>
        </div>
    </section>

    <!-- Games Grid -->
    <section class="py-5">
        <div class="container">
            <!-- Filter -->
            <div class="d-flex gap-2 mb-4 flex-wrap">
                <button class="btn btn-sm btn-outline-secondary rounded-pill px-3 active" id="filterAll"
                    onclick="filterGames('all')">All Games</button>
                <button class="btn btn-sm btn-outline-secondary rounded-pill px-3"
                    onclick="filterGames('android')">Android</button>
                <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="filterGames('pc')">PC /
                    Desktop</button>
                <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="filterGames('web')">Web /
                    HTML5</button>
                <a href="dashboard.html" class="btn btn-sm btn-outline-info rounded-pill px-3 ms-auto">
                    <i class="bi bi-collection me-1"></i>My Licenses
                </a>
            </div>

            <div class="row g-4" id="gamesGrid">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-info" role="status"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- License Tiers Explained -->
    <section class="py-5" style="background:rgba(255,255,255,.02)">
        <div class="container">
            <h4 class="fw-bold text-center mb-5">What's Included in Each License?</h4>
            <div class="row g-4 justify-content-center" id="tierExplainedGrid">
                <!-- Dynamically loaded -->
            </div>
        </div>
    </section>

    <div id="footerPlaceholder"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../lib/supabase.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/header.js"></script>
    <script src="../assets/js/footer.js"></script>
    <script src="../assets/js/sharda-access.js"></script>
    <script src="../assets/js/payments.js"></script>
    <script>
        window.ShardaBaseUrl = '../';
        let allGames = [];
        let globalTiers = [];

        async function init() {
            // Fetch Games
            const { data: games } = await supabase.from('products').select('*,product_tiers(*)').eq('product_type', 'game').eq('is_active', true);
            allGames = games || [];

            // Extract unique tiers for the "Explained" section
            // We take tiers from the first game that has them
            const sampleGame = allGames.find(g => g.product_tiers && g.product_tiers.length > 0);
            globalTiers = sampleGame ? sampleGame.product_tiers : [];

            renderGames(allGames);
            renderTierExplained();
        }

        function renderGames(games) {
            const grid = document.getElementById('gamesGrid');
            if (!games || !games.length) {
                grid.innerHTML = '<div class="col-12 text-center text-secondary py-5">No games found. Add them in the Admin Panel!</div>';
                return;
            }
            grid.innerHTML = games.map(g => {
                const tiers = g.product_tiers || [];
                return `
    <div class="col-md-6 col-lg-4 game-item">
      <div class="glass game-card">
        <div class="position-relative overflow-hidden" onclick="window.location.href='../product.html?id=${g.id}'">
          <img src="${g.image_url || 'https://via.placeholder.com/400x200/1a1a3e/8b5cf6?text=' + encodeURIComponent(g.title)}"
               class="game-thumb" alt="${g.title}">
          <div class="position-absolute top-0 start-0 p-2 d-flex gap-1">
            ${(g.meta_data?.platforms || ['pc', 'web']).map(p => `<span class="badge bg-dark bg-opacity-75 platform-badge text-capitalize">${p}</span>`).join('')}
          </div>
        </div>
        <div class="p-4">
          <h5 class="fw-bold mb-1">${g.title}</h5>
          <p class="text-secondary small mb-4">${g.tagline || ''}</p>
          <div class="row g-2">
            ${tiers.length > 0 ? tiers.sort((a, b) => a.price_inr - b.price_inr).map(t => `
            <div class="col-6">
              <button class="btn w-100 btn-sm rounded-3 py-2 fw-medium"
                      style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)"
                      onclick="handleGameTier('${g.id}','${g.title}','${t.name}',${t.price_inr},'${t.id}')">
                <span class="badge ${t.price_inr === 0 ? 'tier-demo' : 'tier-full'} d-block mb-1" style="font-size:.6rem">${t.name}</span>
                <span class="text-info fw-bold">${t.price_inr === 0 ? 'Free' : '₹' + t.price_inr.toLocaleString()}</span>
              </button>
            </div>`).join('') : '<div class="col-12 text-center small text-secondary">No tiers available</div>'}
          </div>
        </div>
      </div>
    </div>`;
            }).join('');
        }

        function renderTierExplained() {
            const container = document.getElementById('tierExplainedGrid');
            if (!globalTiers.length) {
                container.innerHTML = '<div class="col-12 text-center text-secondary py-3">Add tiers to your games in Admin to see features here.</div>';
                return;
            }

            container.innerHTML = globalTiers.sort((a, b) => a.price_inr - b.price_inr).map(t => {
                const badgeClass = t.price_inr === 0 ? 'tier-demo' : (t.price_inr > 1000 ? 'tier-source' : 'tier-full');
                const icon = t.price_inr === 0 ? 'bi-play-circle' : 'bi-gamepad';
                return `
                <div class="col-sm-6 col-lg-4">
                    <div class="glass rounded-4 p-4 h-100 text-center">
                        <i class="bi ${icon} fs-2 mb-3 d-block" style="color:#8b5cf6"></i>
                        <span class="tier-badge ${badgeClass} mb-2 d-inline-block">${t.name}</span>
                        <div class="fw-bold text-white mb-3">${t.price_inr === 0 ? 'Free' : '₹' + t.price_inr.toLocaleString()}</div>
                        <ul class="list-unstyled text-secondary small text-start">
                            ${(t.features || []).map(f => `<li class="mb-1"><i class="bi bi-check text-success me-1"></i>${f}</li>`).join('')}
                        </ul>
                    </div>
                </div>`;
            }).join('');
        }

        function filterGames(platform) {
            document.querySelectorAll('[onclick*="filterGames"]').forEach(b => b.classList.remove('active', 'btn-info'));
            event.target.classList.add('active');
            const filtered = platform === 'all' ? allGames : allGames.filter(g => (g.meta_data?.platforms || ['pc', 'web']).includes(platform));
            renderGames(filtered);
        }

        async function handleGameTier(gameId, title, tierName, price, tierId) {
            const user = window.SubpassAuth?.user;
            if (!user) { window.location.href = '../login.html'; return; }

            if (price === 0) {
                ShardaPayments.showToast('Demo access granted!', 'success');
                await supabase.from('game_licenses').upsert([{ user_id: user.id, product_id: gameId, tier_id: tierId, max_downloads: 1 }]);
                setTimeout(() => window.location.href = 'dashboard.html', 1000);
                return;
            }

            await ShardaPayments.quickBuy({
                id: gameId, name: title + ' — ' + tierName, price, icon: 'bi-controller', tierId: tierId, maxDownloads: 3, section: 'game'
            }, 'game');
        }

        document.addEventListener('DOMContentLoaded', () => {
            new Promise(r => { if (window.SubpassAuth?.ready) window.SubpassAuth.ready.then(r); else setTimeout(r, 800); }).then(init);
        });
    </script>

</body>

</html>
