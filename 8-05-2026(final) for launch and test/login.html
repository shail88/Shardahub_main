<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | ShardaHub Ecosystem</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- ShardaHub Core Assets -->
    <link rel="stylesheet" href="assets/css/core.css">
    <style>
        body {
            background: radial-gradient(circle at top right, rgba(59, 130, 246, 0.1) 0%, rgba(15, 23, 42, 1) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            padding: 3rem;
        }

        .form-control-auth {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
        }

        .form-control-auth:focus {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
            color: white;
        }
    </style>
</head>

<body>
    <div class="glass auth-card rounded-4">
        <div class="text-center mb-5">
            <a href="index.html" class="text-decoration-none">
                <i class="bi bi-layers-half fs-1 text-gradient"></i>
                <h2 class="fw-bold text-white mt-2">ShardaHub</h2>
            </a>
            <p class="text-secondary">Sign in to your unified account.</p>
        </div>

        <form id="loginForm">
            <div class="mb-4">
                <label class="form-label text-secondary small">EMAIL ADDRESS</label>
                <input type="email" class="form-control form-control-auth" placeholder="name@company.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary small">PASSWORD</label>
                <input type="password" class="form-control form-control-auth" placeholder="••••••••" required>
            </div>
            <div class="d-flex justify-content-between mb-4">
                <div class="form-check">
                    <input class="form-check-input bg-transparent border-secondary" type="checkbox" id="rememberMe">
                    <label class="form-check-label text-secondary small" for="rememberMe">Remember me</label>
                </div>
                <a href="#" class="text-decoration-none text-info small">Forgot Password?</a>
            </div>
            <button type="submit" class="btn btn-info w-100 rounded-pill py-3 fw-bold glow-effect">Sign In</button>
        </form>

        <div class="text-center mt-5">
            <p class="text-secondary small">New to ShardaHub? <a href="signup.html"
                    class="text-info text-decoration-none fw-bold">Create an account</a></p>
        </div>
    </div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="lib/supabase.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = e.target.querySelector('input[type="email"]').value.trim();
            const password = e.target.querySelector('input[type="password"]').value;

            if (!email || !password) {
                alert("Please enter both email and password.");
                return;
            }

            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Signing In...';

            try {
                const { data, error } = await window.shardaHubAuth.signIn(email, password);

                if (error) {
                    let msg = error.message;
                    // Supabase often returns generic messages, let's make them clearer
                    if (msg.toLowerCase().includes("invalid login credentials")) {
                        msg = "Invalid email or password. Please try again.";
                    } else if (msg.toLowerCase().includes("email not confirmed")) {
                        msg = "Your email address has not been confirmed yet. Please check your inbox for the verification link.";
                    }

                    alert(msg || "Login failed. Please check your credentials.");
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Sign In';
                } else {
                    // Smart Redirection based on role
                    const user = data.user;
                    // Note: We might need to fetch the role here if it's not in the auth session metadata
                    // But SubpassAuth.init() usually handles this. Since we just signed in, 
                    // let's do a quick check or just redirect to index and let index handle it,
                    // OR better, use a small delay to allow auth state to propagate.

                    window.location.href = 'index.html';
                }
            } catch (err) {
                console.error("Login error:", err);
                alert("An unexpected error occurred. Please try again.");
                submitBtn.disabled = false;
                submitBtn.innerText = 'Sign In';
            }
        });
    </script>
</body>

</html>
