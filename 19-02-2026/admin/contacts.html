<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Inquiries | Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/core.css">
</head>

<body class="bg-dark text-white">
    <div id="shardahub-sidebar"></div>

    <div class="main-wrapper">
        <header
            class="py-3 px-4 d-flex justify-content-between align-items-center border-bottom border-secondary glass sticky-top">
            <h1 class="h4 mb-0 fw-bold"><i class="bi bi-envelope text-info me-2"></i>Contact Inquiries</h1>
        </header>

        <div class="container-fluid py-5 px-md-5">
            <div id="contactList" class="row">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-info" role="status"></div>
                    <p class="mt-3 text-secondary">Loading inquiries...</p>
                </div>
            </div>
        </div>

        <div id="shardahub-footer"></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/sharda-db.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/sidebar.js"></script>
    <script src="../assets/js/footer.js"></script>
    <script src="script.js"></script>
</body>

</html>
