<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | ShardaHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/core.css">
    <style>
        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: var(--ai-accent);
            transform: translateY(-5px);
        }
    </style>
</head>

<body class="bg-dark text-white">
    <div id="shardahub-sidebar"></div>

    <div class="main-wrapper">
        <div class="container-fluid py-5 px-md-5">
            <!-- Stats -->
            <!-- Global Ecosystem Stats -->
            <div class="row g-4 mb-5">
                <div class="col-md-2">
                    <div class="stat-card p-4 rounded-4">
                        <div class="text-secondary small mb-1">TOTAL REVENUE (ALL)</div>
                        <h2 class="fw-bold text-info" id="totalRevenue">₹0</h2>
                        <div class="small text-success mt-2"><i class="bi bi-graph-up"></i> +12%</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card p-4 rounded-4">
                        <div class="text-secondary small mb-1">AI GENERATIONS</div>
                        <h2 class="fw-bold text-gradient" id="totalAIGen">0</h2>
                        <div class="small text-secondary mt-2">Successful tool runs</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card p-4 rounded-4">
                        <div class="text-secondary small mb-1">SAAS SUBSCRIBERS</div>
                        <h2 class="fw-bold text-warning" id="totalSaaSSubs">0</h2>
                        <div class="small text-secondary mt-2">Active pro plans</div>
                    </div>
                </div>
                <div class="col-md-2">
                    <div class="stat-card p-4 rounded-4">
                        <div class="text-secondary small mb-1">GAMES PLAYED</div>
                        <h2 class="fw-bold text-success" id="totalGamesPlayed">0</h2>
                        <div class="small text-secondary mt-2">Active ecosystem sessions</div>
                    </div>
                </div>
                <div class="col-md-2">
                    <div class="stat-card p-4 rounded-4">
                        <div class="text-secondary small mb-1">ECOSYSTEM PRODUCTS</div>
                        <h2 class="fw-bold text-info" id="totalProducts">0</h2>
                        <a href="courses.html" class="small text-info text-decoration-none mt-2 d-block">Manage Master
                            List &rarr;</a>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-8">
                    <div class="glass p-4 rounded-4 mb-4">
                        <h5 class="fw-bold mb-4">Recent Enrollments</h5>
                        <div class="table-responsive">
                            <table class="table table-dark table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>Student</th>
                                        <th>Course</th>
                                        <th>Date</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="enrollmentTable">
                                    <tr>
                                        <td colspan="4" class="text-center py-4 text-secondary">Loading...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="glass p-4 rounded-4 h-100">
                        <h5 class="fw-bold mb-4">Quick Actions</h5>
                        <div class="d-grid gap-3">
                            <a href="courses.html?action=add" class="btn btn-info rounded-pill py-3 fw-bold">
                                <i class="bi bi-plus-circle me-2"></i> Add New Course
                            </a>
                            <button class="btn btn-outline-light rounded-pill py-3" onclick="exportData()">
                                <i class="bi bi-download me-2"></i> Export Report
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="shardahub-footer"></div>
    </div>

    <!-- SDKs -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../lib/supabase.js"></script>
    <script src="../assets/js/sharda-db.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/sidebar.js"></script>
    <script src="../assets/js/header.js"></script>
    <script src="../assets/js/footer.js"></script>
    <script src="script.js"></script>
</body>

</html>
